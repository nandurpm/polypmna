name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        env:
          VITE_BASE_PATH: /polypmna/
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # GitHub Pages does not natively rewrite SPA routes to index.html.
      # Publish both a fallback page and route directories so direct links,
      # refreshes, PDF viewers, lessons, and utility pages all resolve.
      - name: Prepare SPA route fallbacks
        run: |
          cp dist/index.html dist/404.html
          for route in dashboard ask-ai mock-exams question-papers student-tools pdf lesson resources; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
