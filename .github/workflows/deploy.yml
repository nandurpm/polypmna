name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun run test:run

      - name: Build
        env:
          VITE_BASE_PATH: /polypmna/
          VITE_CONVEX_URL: https://oceanic-snail-406.convex.cloud
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # GitHub Pages does not natively rewrite SPA routes to index.html.
      # Publish both a fallback page and route directories so direct links,
      # refreshes, PDF viewers, lessons, and utility pages all resolve.
      - name: Prepare SPA route fallbacks
        run: |
          cp dist/index.html dist/404.html
          for route in auth dashboard ask-ai mock-exams question-papers student-tools pdf lesson resources curriculum subject; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      # The build keeps /polypmna/ as its canonical asset base for GitHub's
      # project site. Mirror the generated assets and public files there too,
      # so the same artifact also works at a custom-domain root (/).
      - name: Mirror project-base assets for custom domain
        run: |
          mkdir -p dist/polypmna
          find dist -maxdepth 1 -type f -exec cp -f {} dist/polypmna/ \;
          if [ -d dist/assets ]; then cp -a dist/assets dist/polypmna/; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  convex:
    name: Deploy Convex AI backend
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Convex deployment credential
        id: convex_gate
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Convex AI deployment skipped: add CONVEX_DEPLOY_KEY to enable server-side provider deployment."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure provider secrets in Convex production
        if: steps.convex_gate.outputs.enabled == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API || secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS || secrets.OPENROUTER_MODELS }}
          NVIDIA_API_KEY: ${{ secrets.NVDIA_API || secrets.NVIDIA_API || secrets.NVIDIA_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            printf '%s' "$OPENROUTER_API_KEY" | bunx convex env set --prod OPENROUTER_API_KEY
          fi
          openrouter_models="${OPENROUTER_MODELS:-cohere/north-mini-code:free,google/gemma-4-31b-it:free,nvidia/nemotron-3.5-lightning:free}"
          printf '%s' "$openrouter_models" | bunx convex env set --prod OPENROUTER_MODELS
          if [ -n "$NVIDIA_API_KEY" ]; then
            printf '%s' "$NVIDIA_API_KEY" | bunx convex env set --prod NVIDIA_API_KEY
          fi
          printf '%s' "nvidia/nemotron-3.5-lightning-30b-a3b" | bunx convex env set --prod NVIDIA_MODEL
          printf '%s' "10000" | bunx convex env set --prod POLY_AI_NVIDIA_TIMEOUT_MS
          printf '%s' "25000" | bunx convex env set --prod POLY_AI_PROVIDER_TIMEOUT_MS
          printf '%s' "90000" | bunx convex env set --prod POLY_AI_STREAM_TIMEOUT_MS
          printf '%s' "1600" | bunx convex env set --prod POLY_AI_MAX_TOKENS
          printf '%s' "true" | bunx convex env set --prod POLY_AI_FREE_FIRST
          printf '%s' "https://nandurpm.github.io/polypmna/" | bunx convex env set --prod POLY_AI_SITE_URL
          printf '%s' "https://nandurpm.github.io/polypmna/" | bunx convex env set --prod SITE_URL
          printf '%s' "https://freebuff.com" | bunx convex env set --prod VLY_CONVEX_AUTH_ISSUER

      - name: Ensure Convex Auth signing keys
        if: steps.convex_gate.outputs.enabled == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          private_key="$(bunx convex env get --prod JWT_PRIVATE_KEY 2>/dev/null || true)"
          jwks="$(bunx convex env get --prod JWKS 2>/dev/null || true)"
          is_present() {
            local value="$1"
            [[ -n "$value" && "$value" != "undefined" && "$value" != "null" && "$value" != *"not found"* && "$value" != *"not set"* ]]
          }
          if is_present "$private_key" && is_present "$jwks"; then
            echo "Convex Auth signing keys already configured"
          else
            bun scripts/generate-convex-auth-keys.mjs "$key_dir"
            bunx convex env set --prod JWT_PRIVATE_KEY < "$key_dir/JWT_PRIVATE_KEY"
            bunx convex env set --prod JWKS < "$key_dir/JWKS"
            echo "Generated and configured Convex Auth signing keys"
          fi

      - name: Deploy Convex functions
        if: steps.convex_gate.outputs.enabled == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy --message "Deploy provider-backed POLY AI"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
