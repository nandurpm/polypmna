# ============================================================
# FILE: resource-health.yml
# PURPOSE: Checks curriculum manifests and representative public resources on changes and a daily schedule.
# ============================================================

name: Public resource health

on:
  push:
    branches: [main]
    paths:
      - "scripts/check-public-resources.mjs"
      - "src/lib/polydata.ts"
      - ".github/workflows/resource-health.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check curriculum manifests and sample resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check public resources
        run: node scripts/check-public-resources.mjs
